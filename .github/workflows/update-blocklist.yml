name: Update AI blocklist

on:
  schedule:
    # Weekly, Mondays at 04:00 UTC. The source refreshes daily, so this lags
    # upstream by up to ~6 days; change to "0 4 * * *" for a daily run.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-blocklist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate blocklist
        run: python update_blocklist.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- ai-blocklist.txt ai-blocklist-domains.txt; then
            echo "No changes to the blocklist files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-blocklist.txt ai-blocklist-domains.txt
          git commit -m "Update AI blocklist"
          git push
